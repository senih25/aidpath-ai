name: AidPath WebMCP synthetic contract

on:
  pull_request:
    paths:
      - "webmcp.html"
      - "test/webmcp-contract.mjs"
      - ".github/workflows/g10-webmcp-contract.yml"
  push:
    branches: [main]
    paths:
      - "webmcp.html"
      - "test/webmcp-contract.mjs"
      - ".github/workflows/g10-webmcp-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webmcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate offline tool registration and synthetic interactions
        run: node test/webmcp-contract.mjs
